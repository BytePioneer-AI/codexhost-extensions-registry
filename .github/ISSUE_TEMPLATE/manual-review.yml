name: Manual extension review / 申请人工审查上架
description: Request manual review when an extension cannot pass automatic validation (e.g. backend child_process usage). / 当扩展因特殊能力（如后端调用本机命令行）无法通过自动校验时，提交人工审查上架。
title: "[Manual review] "
body:
  - type: markdown
    attributes:
      value: |
        如果你的扩展因需要调用本机命令行（`child_process`）等正当能力而无法通过自动校验，请填写以下信息申请人工审查。维护者审核通过后会在 `sources/<id>.json` 中单独放行上架。

        也可以扫码添加维护者微信（见 [CodexHost README 微信联系方式](https://github.com/BytePioneer-AI/codex-host/blob/main/docs/project/README.zh-CN.md#%E5%BE%AE%E4%BF%A1%E4%BA%A4%E6%B5%81%E7%BE%A4)，备注“CodexHost 插件”）直接沟通。

        If your extension cannot pass automatic checks for a legitimate reason (for example, a `backend` that spawns local CLI tools via `child_process`), share the details below for manual maintainer review.
  - type: input
    id: repo_url
    attributes:
      label: Repository URL / 扩展仓库地址
      description: Public GitHub repository URL (`https://github.com/<owner>/<repo>`).
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Extension introduction / 插件介绍
      description: Briefly describe what the extension does and how users use it. / 简要说明插件的功能与使用场景。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason for manual review / 触发拦截的原因与安全说明
      description: Explain which check failed (e.g. `child_process`), which files/commands are involved, and what safeguards are in place. / 说明未通过哪项检查、涉及哪些文件与本机命令，以及做了哪些安全限制。
    validations:
      required: true
