name: Desktop extension registry

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - validate-and-build-catalog.mjs
      - runtime.mjs
      - package.json
      - package-lock.json
      - .github/workflows/registry-sync.yml
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test worker/worker.test.mjs scripts/check-worker-health.test.mjs
      - run: node validate-and-build-catalog.mjs --check-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        run: if test -f safety-report.md; then cat safety-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.md

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: registry-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node validate-and-build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_URL: ${{ vars.STATS_URL }}
      - if: always()
        run: if test -f safety-report.md; then cat safety-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.md
      - name: Publish catalog if changed
        run: |
          git add -- catalog.json catalog.v2.json
          git diff --cached --quiet -- catalog.json catalog.v2.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Desktop & Web extensions catalog'
          git push origin HEAD:main
          sleep 15
          for file in catalog.json catalog.v2.json; do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${file}"
            body=$(curl --max-time 15 -sS -w '\n%{http_code}' "$url" || true)
            status="${body##*$'\n'}"
            payload="${body%$'\n'*}"
            echo "jsDelivr purge ${file} (HTTP ${status:-error}): ${payload}"
            if [ "$status" != "200" ]; then
              echo "::warning::jsDelivr purge for ${file} returned HTTP ${status:-error}"
            fi
          done

  monitor-worker:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.STATS_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Worker health and reconcile alert issue
        run: node scripts/check-worker-health.mjs
        env:
          STATS_URL: ${{ vars.STATS_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
