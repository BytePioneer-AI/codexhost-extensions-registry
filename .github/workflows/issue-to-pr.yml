name: Submission issue to PR

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Submission issue number to process
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: submission-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (startsWith(github.event.issue.title, '[Desktop extension]') ||
        startsWith(github.event.issue.title, '[Manual review]') ||
        contains(github.event.issue.body, '### GitHub repository URL') ||
        contains(github.event.issue.body, '### Repository URL')))
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Parse issue and create the extension source file
        id: prepare
        continue-on-error: true
        run: node scripts/issue-to-pr.mjs

      - name: Comment parse error on issue
        if: steps.prepare.outputs.status == 'error' || steps.prepare.outcome == 'failure'
        env:
          ERROR_MESSAGE: ${{ steps.prepare.outputs.error_message }}
        run: |
          {
            echo "❌ **Automatic submission check failed / 自动投稿校验失败**"
            echo ""
            echo "Could not prepare a \`sources/<id>.json\` entry from this issue:"
            echo ""
            printf '> %s\n' "${ERROR_MESSAGE:-Unexpected error while parsing the submission issue.}"
            echo ""
            echo "Please make sure the **GitHub repository URL** field contains a valid public \`https://github.com/<owner>/<repo>\` URL with a valid \`manifest.json\` (in the latest Release \`.zip\` or on the default branch), then edit this issue to re-run automatically."
            echo ""
            echo "请确认 **GitHub repository URL** 为公开的 \`https://github.com/<owner>/<repo>\` 仓库地址且包含合法的 \`manifest.json\`，修改本 Issue 后会自动重新校验。"
            echo ""
            echo "---"
            echo ""
            echo "💬 **需要人工协助？ / Need manual review?**"
            echo ""
            echo "- 可直接在本仓库提交 **[人工审查上架 Issue](https://github.com/BytePioneer-AI/codexhost-extensions-registry/issues/new?template=manual-review.yml)**（说明仓库地址、插件介绍与遇到的问题），维护者人工审查后协助上架。"
            echo "- 也可以联系维护者微信沟通（二维码见 [CodexHost 微信联系方式](https://github.com/BytePioneer-AI/codex-host/blob/main/docs/project/README.zh-CN.md#%E5%BE%AE%E4%BF%A1%E4%BA%A4%E6%B5%81%E7%BE%A4)，备注「CodexHost 插件」）。"
            echo "- Or open a [Manual Review Issue](https://github.com/BytePioneer-AI/codexhost-extensions-registry/issues/new?template=manual-review.yml) with your repository URL and extension summary so maintainers can review and list it manually."
          } > error-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file error-comment.md
          exit 1

      - name: Comment if already listed
        if: steps.prepare.outputs.status == 'already-exists'
        env:
          EXTENSION_ID: ${{ steps.prepare.outputs.extension_id }}
          REPOSITORY_URL: ${{ steps.prepare.outputs.repository_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "ℹ️ \`$EXTENSION_ID\` ($REPOSITORY_URL) is already listed in \`sources/$EXTENSION_ID.json\`. New releases sync automatically within ~5 minutes."

      - name: Comment duplicate extension ID on issue
        if: steps.prepare.outputs.status == 'id-conflict'
        env:
          EXTENSION_ID: ${{ steps.prepare.outputs.extension_id }}
          EXISTING_REPOSITORY_URL: ${{ steps.prepare.outputs.repository_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ Duplicate extension ID \`$EXTENSION_ID\`: \`sources/$EXTENSION_ID.json\` already belongs to $EXISTING_REPOSITORY_URL. Use a different ID in your manifest and edit this issue to retry."
          exit 1

      - name: Validate sources directory
        id: validate
        if: steps.prepare.outputs.status == 'prepared'
        continue-on-error: true
        shell: bash
        run: node validate-and-build-catalog.mjs --check-only 2>&1 | tee validate.log

      - name: Publish safety report summary
        if: always() && hashFiles('safety-report.md') != ''
        run: cat safety-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safety report artifact
        if: always() && hashFiles('safety-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: safety-report-issue-${{ github.event.issue.number || inputs.issue_number }}
          path: safety-report.md

      - name: Comment validation failure on issue
        if: steps.prepare.outputs.status == 'prepared' && steps.validate.outcome == 'failure'
        run: |
          {
            echo "❌ **Extension validation failed / 插件自动校验未通过**"
            echo ""
            echo "Please fix the issues below in your repository, then edit this issue to re-run validation automatically:"
            echo ""
            echo '```text'
            tail -n 60 validate.log
            echo '```'
            if test -f safety-report.md; then
              echo ""
              echo "<details><summary>Safety report</summary>"
              echo ""
              cat safety-report.md
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "---"
            echo ""
            echo "💬 **因特殊能力（如后端调用 \`child_process\`）或自动校验误拦无法通过？ / Blocked by a legitimate capability (e.g. backend \`child_process\`)?**"
            echo ""
            echo "- 无需反复重试，可以直接在本仓库提交 **[人工审查上架 Issue](https://github.com/BytePioneer-AI/codexhost-extensions-registry/issues/new?template=manual-review.yml)**（附上仓库地址、插件介绍与原因说明），维护者人工审查通过后会手动放行上架。"
            echo "- 也可以直接联系维护者微信沟通（二维码见 [CodexHost 微信联系方式](https://github.com/BytePioneer-AI/codex-host/blob/main/docs/project/README.zh-CN.md#%E5%BE%AE%E4%BF%A1%E4%BA%A4%E6%B5%81%E7%BE%A4)，备注「CodexHost 插件」）。"
            echo "- If your extension requires a restricted capability such as \`child_process\` in its backend, please open a [Manual Review Issue](https://github.com/BytePioneer-AI/codexhost-extensions-registry/issues/new?template=manual-review.yml) with your repository URL, description, and security notes, or reach out via the maintainer's WeChat listed in the CodexHost README."
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          exit 1

      - name: Push branch and open or update PR
        id: pr
        if: steps.prepare.outputs.status == 'prepared' && steps.validate.outcome == 'success'
        env:
          EXTENSION_ID: ${{ steps.prepare.outputs.extension_id }}
          REPOSITORY_URL: ${{ steps.prepare.outputs.repository_url }}
          ISSUE_AUTHOR_LOGIN: ${{ steps.prepare.outputs.issue_author_login }}
          ISSUE_AUTHOR_EMAIL: ${{ steps.prepare.outputs.issue_author_email }}
        run: |
          BRANCH="submission/issue-$ISSUE_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -- "sources/$EXTENSION_ID.json"
          if [ -n "$ISSUE_AUTHOR_LOGIN" ] && [ -n "$ISSUE_AUTHOR_EMAIL" ]; then
            git commit \
              --author="$ISSUE_AUTHOR_LOGIN <$ISSUE_AUTHOR_EMAIL>" \
              -m "feat(registry): add $EXTENSION_ID (#$ISSUE_NUMBER)" \
              -m "Co-authored-by: $ISSUE_AUTHOR_LOGIN <$ISSUE_AUTHOR_EMAIL>"
          else
            git commit -m "feat(registry): add $EXTENSION_ID (#$ISSUE_NUMBER)"
          fi
          git push --force origin "HEAD:$BRANCH"

          {
            if test -f pr-preview.md; then
              cat pr-preview.md
            else
              echo "Closes #$ISSUE_NUMBER"
              echo ""
              echo "- **Extension ID**: \`$EXTENSION_ID\`"
              echo "- **Repository**: $REPOSITORY_URL"
              echo "- **Validation**: \`node validate-and-build-catalog.mjs --check-only\` passed ✅"
              echo ""
            fi
            if test -f safety-report.md; then
              echo "---"
              echo ""
              echo "<details>"
              echo "<summary>安全扫描报告 / Safety report</summary>"
              echo ""
              cat safety-report.md
              echo ""
              echo "</details>"
            fi
          } > pr-body.md

          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "feat(registry): add $EXTENSION_ID (#$ISSUE_NUMBER)" \
              --body-file pr-body.md
            PR_NUMBER="$EXISTING_PR"
            PR_URL="$(gh pr view "$EXISTING_PR" --json url --jq '.url')"
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(registry): add $EXTENSION_ID (#$ISSUE_NUMBER)" \
              --body-file pr-body.md)"
            PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number' 2>/dev/null || gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            echo "pr_created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Auto-merge eligible frontend submission
        id: automerge
        if: steps.pr.outcome == 'success' && steps.prepare.outputs.auto_approve == 'true' && steps.pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          MERGED=false
          MERGE_OUTPUT=""
          for attempt in 1 2 3; do
            if MERGE_OUTPUT="$(gh pr merge "$PR_NUMBER" --squash --delete-branch 2>&1)"; then
              MERGED=true
              break
            fi
            echo "Auto-merge attempt ${attempt} failed: ${MERGE_OUTPUT}"
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done
          if [ "$MERGED" = "true" ]; then
            echo "$MERGE_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            gh workflow run registry-sync.yml --ref main || echo "::warning::Auto-merged PR #$PR_NUMBER, but triggering registry-sync.yml failed; the scheduled sync will publish the catalog."
          else
            echo "::warning::Could not auto-merge PR #$PR_NUMBER (e.g. branch protection rules); leaving PR open for manual maintainer merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment auto-merged status on issue
        if: steps.pr.outcome == 'success' && steps.automerge.outputs.merged == 'true' && steps.pr.outputs.pr_url != ''
        env:
          EXTENSION_ID: ${{ steps.prepare.outputs.extension_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          {
            echo "✅ **Validation passed & auto-merged / 自动校验通过并已自动上架**"
            echo ""
            echo "Automatically merged pull request for \`$EXTENSION_ID\`: $PR_URL"
            echo ""
            echo "Catalog sync (\`registry-sync.yml\`) has been triggered immediately — your extension should appear in the marketplace within ~1 minute."
            echo "已满足纯前端且仓库本人投稿的自动通过条件并完成合并，目录同步已立即触发，插件预计约 1 分钟内即可在扩展市场可见。"
          } > pr-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file pr-comment.md
          gh issue close "$ISSUE_NUMBER" --reason completed || echo "::warning::Auto-merged PR for issue #$ISSUE_NUMBER, but closing the issue failed."

      - name: Comment PR link on issue
        if: steps.pr.outcome == 'success' && steps.automerge.outputs.merged != 'true' && steps.pr.outputs.pr_url != '' && (steps.pr.outputs.pr_created == 'true' || steps.automerge.outputs.merged == 'false')
        env:
          EXTENSION_ID: ${{ steps.prepare.outputs.extension_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          AUTO_APPROVE: ${{ steps.prepare.outputs.auto_approve }}
          AUTO_APPROVE_REASON: ${{ steps.prepare.outputs.auto_approve_reason }}
          AUTO_MERGE_RESULT: ${{ steps.automerge.outputs.merged }}
        run: |
          {
            echo "✅ **Validation passed / 自动校验通过**"
            echo ""
            echo "Opened pull request for \`$EXTENSION_ID\`: $PR_URL"
            echo ""
            if [ "$AUTO_APPROVE" = "true" ] && [ "$AUTO_MERGE_RESULT" = "false" ]; then
              echo "🟡 **Manual merge needed / 需维护者手动合并**"
              echo ""
              echo "This submission passed automatic frontend approval checks, but automatic merge could not complete (for example due to repository branch protection rules). A maintainer will merge it shortly."
              echo "该投稿满足纯前端自动通过条件，但自动合并未能完成（例如受仓库分支保护规则限制），PR 已保持开启状态，等待维护者合并后即会自动同步上架。"
            else
              echo "🟡 **Manual maintainer review required / 需维护者人工审核**"
              echo ""
              printf '> %s\n' "${AUTO_APPROVE_REASON:-Manual review is required before merging.}"
              echo ""
              echo "Once a maintainer reviews and merges this PR, the extension will be published to the marketplace catalog automatically."
              echo "维护者人工审核并合并该 PR 后，插件会自动同步上架到市场目录。"
            fi
          } > pr-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file pr-comment.md
