name = "codexhost-desktop-extension-stats"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Primary analytics & extension stats store (Cloudflare D1 / SQLite).
# Replace with the ID from `npx wrangler d1 create codexhost-stats`.
[[d1_databases]]
binding = "STATS_DB"
database_name = "codexhost-stats"
database_id = "YOUR_D1_DATABASE_ID"

# Legacy KV namespace (retained for backward compatibility if STATS_DB is unset).
[[kv_namespaces]]
binding = "STATS_KV"
id = "YOUR_KV_NAMESPACE_ID"

# Stateless 5-minute update watcher: compares sources/ against catalog.v2.json
# and dispatches registry-sync.yml when a package URL changes or a source is removed.
# Requires `npx wrangler secret put GITHUB_TOKEN` (fine-grained PAT with
# Actions: Read and write on the registry repository).
# Dashboard requires `npx wrangler secret put DASHBOARD_TOKEN`.
[triggers]
crons = ["*/5 * * * *"]

[vars]
REGISTRY_REPO = "BytePioneer-AI/codexhost-extensions-registry"
REGISTRY_WORKFLOW = "registry-sync.yml"
