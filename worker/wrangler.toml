name = "codexhost-desktop-extension-stats"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Replace with the ID from `npx wrangler kv namespace create STATS_KV`.
[[kv_namespaces]]
binding = "STATS_KV"
id = "YOUR_KV_NAMESPACE_ID"

# Stateless 5-minute update watcher: compares each source's latest Release ZIP
# (or default-branch HEAD commit when no Release exists) against catalog.json
# and dispatches registry-sync.yml only when a package URL changes.
# Requires `npx wrangler secret put GITHUB_TOKEN` (fine-grained PAT with
# Actions: Read and write on the registry repository).
[triggers]
crons = ["*/5 * * * *"]

[vars]
REGISTRY_REPO = "BytePioneer-AI/codexhost-extensions-registry"
REGISTRY_WORKFLOW = "registry-sync.yml"
